<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="0" fill="url(#bgGrad)"/>

  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="400" cy="210" r="160"/>
    <circle cx="400" cy="210" r="220"/>
    <circle cx="400" cy="210" r="280" stroke-dasharray="8 8"/>
    <line x1="100" y1="0" x2="100" y2="500" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="500" stroke-dasharray="4 4"/>
  </g>

  <circle cx="400" cy="200" r="200" fill="url(#emeraldGlow)"/>

  <g filter="url(#dropShadow)">
    <rect x="335" y="135" width="130" height="130" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <circle cx="400" cy="200" r="45" fill="url(#iconGrad)"/>
    
    <path d="M388 190 C388 186 391 183 395 183 L405 183 C409 183 412 186 412 190 L412 193 L418 193 C421 193 423 195 423 198 L423 213 C423 216 421 218 418 218 L382 218 C379 218 377 216 377 213 L377 198 C377 195 379 193 382 193 L388 193 Z M393 193 L407 193 L407 189 C407 188 406 187 405 187 L395 187 C394 187 393 188 393 189 Z" fill="#ffffff"/>
    <path d="M377 203 L423 203" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="400" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Trampo<tspan fill="#10b981">Certo</tspan>
  </text>

  <text x="400" y="358" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
    SERVIÇO PROFISSIONAL
  </text>

  <rect x="345" y="385" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="400" y="401" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">
    ★ Qualidade Garantida
  </text>
</svg>
